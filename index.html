<style>
  :root {
    --navy: #0A1628;
    --navy-mid: #132040;
    --steel: #1E3A5F;
    --accent: #2E86C1;
    --accent-light: #5DADE2;
    --gold: #D4A017;
    --white: #FFFFFF;
    --off-white: #F4F7FA;
    --gray-light: #E8EDF3;
    --gray-mid: #8FA3B8;
    --gray-text: #4A5568;
    --text: #1A202C;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; background: var(--white); color: var(--text); line-height: 1.6; }

  nav {
    position: fixed; top: 0; width: 100%; z-index: 100;
    background: rgba(10, 22, 40, 0.97);
    backdrop-filter: blur(8px);
    padding: 0 5%;
    display: flex; align-items: center; justify-content: space-between;
    height: 64px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
  }
  .nav-logo { font-family: 'Playfair Display', serif; color: var(--white); font-size: 1.3rem; letter-spacing: 0.02em; }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 2rem; list-style: none; }
  .nav-links a { color: var(--gray-mid); text-decoration: none; font-size: 0.85rem; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; transition: color 0.2s; }
  .nav-links a:hover { color: var(--accent-light); }

  #hero {
    min-height: 100vh;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: flex-end;
    padding: 120px 5% 80px;
    background-color: var(--navy);
  }
